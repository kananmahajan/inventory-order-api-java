services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${DB_USERNAME:-inventory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inventory} -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/inventory_db
      DB_USERNAME: ${DB_USERNAME:-inventory}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Copy .env.example to .env and set ADMIN_PASSWORD}
      CUSTOMER_USERNAME: ${CUSTOMER_USERNAME:-customer}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:?Copy .env.example to .env and set CUSTOMER_PASSWORD}
    ports:
      - "8080:8080"
volumes:
  inventory-data:
